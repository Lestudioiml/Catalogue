<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bagagerie 2027 · IML Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#f26b1d;--c2:#7a2c05;--light:#ffd3b0;--ink:#fff;--inv:#111;--line:rgba(255,255,255,.28);--pill:rgba(0,0,0,.22);--wm:rgba(255,255,255,.10)}
.stage.lt{--ink:#141414;--inv:#fff;--line:rgba(0,0,0,.22);--pill:rgba(255,255,255,.45);--wm:rgba(0,0,0,.07)}
.stage{color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:fixed;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 52%,var(--light) 0%,var(--c) 42%,var(--c2) 100%);transition:background .7s}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.14),transparent 22%,transparent 72%,rgba(0,0,0,.22));pointer-events:none}
.stage.lt:after{background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 22%,transparent 72%,rgba(0,0,0,.06))}
.frame{position:absolute;inset:0;overflow:hidden;z-index:1}
/* nav */
.nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 34px;z-index:5}
.logo{font-weight:700;letter-spacing:.18em;font-size:12px;min-width:150px}
.brands{display:flex;gap:2px;background:var(--pill);padding:5px;border-radius:40px;border:1px solid var(--line);max-width:calc(100vw - 420px);overflow-x:auto;scrollbar-width:none}
.brands::-webkit-scrollbar{display:none}
.brands button{padding:9px 14px;border-radius:30px;font-size:11.5px;font-weight:600;letter-spacing:.1em;opacity:.8;transition:.25s;white-space:nowrap}
.brands button:hover{opacity:1}
.brands button.on{background:var(--ink);color:var(--inv);opacity:1}
.navr{font-size:11px;letter-spacing:.12em;opacity:.85;text-align:right;line-height:1.5}
/* hero */
.hero{position:absolute;inset:0;display:grid;grid-template-columns:minmax(260px,1fr) minmax(380px,1.5fr) minmax(230px,.9fr);align-items:center;padding:90px 54px 90px}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);font-family:Anton,sans-serif;font-size:min(22vw,330px);line-height:.8;color:var(--wm);white-space:nowrap;text-transform:uppercase;pointer-events:none;letter-spacing:.01em}
.left{position:relative;z-index:2;max-width:380px}
.kicker{font-size:11px;letter-spacing:.32em;font-weight:600;opacity:.85;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.kicker:before{content:"";width:28px;height:1px;background:var(--ink)}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(46px,6vw,92px);line-height:.92;text-transform:uppercase;letter-spacing:.005em}
.sub{margin:14px 0 14px;font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.95}
.desc{font-size:14px;line-height:1.6;opacity:.88;font-weight:300}
.cta{margin-top:26px;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--inv);padding:13px 20px 13px 22px;border-radius:40px;font-weight:600;font-size:13px;transition:.25s}
.cta:hover{transform:translateX(4px)}
.cta span{width:24px;height:24px;border-radius:50%;background:var(--inv);color:var(--ink);display:grid;place-items:center;font-size:12px}
.center{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.center img.lr{max-height:min(42vh,420px)}
.center{perspective:1400px}
.spin{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center}
.fl{position:relative;z-index:2;animation:float 6s ease-in-out infinite;transform-style:preserve-3d}
.center img{display:block;max-width:100%;max-height:min(62vh,600px);object-fit:contain;filter:drop-shadow(0 30px 26px rgba(0,0,0,.32)) drop-shadow(0 8px 10px rgba(0,0,0,.2));transform-origin:50% 85%;will-change:transform}
.center img.turn-out{animation:turnOut .42s cubic-bezier(.55,0,.8,.4) forwards}
.center img.turn-in{animation:turnIn .7s cubic-bezier(.15,.75,.25,1) forwards}
@keyframes turnOut{to{transform:rotateY(-80deg) scale(.88);opacity:0;filter:blur(2px) brightness(.8)}}
@keyframes turnIn{from{transform:rotateY(80deg) scale(.88);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* roue : couleurs animées + calque de vol */
@property --c{syntax:'<color>';inherits:true;initial-value:#f26b1d}
@property --c2{syntax:'<color>';inherits:true;initial-value:#7a2c05}
@property --light{syntax:'<color>';inherits:true;initial-value:#ffd3b0}
.stage{transition:--c 1s ease,--c2 1s ease,--light 1s ease}
#fly{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#fly img{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity;filter:drop-shadow(0 30px 26px rgba(0,0,0,.32)) drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.nav{z-index:6}
/* textes animés */
.ln{display:inline-block;white-space:nowrap;overflow:hidden;vertical-align:bottom;padding-bottom:.04em}
.ch{display:inline-block;transform:translateY(105%);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none}}
.fx{opacity:0;transform:translateY(14px);animation:fadeup .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fadeup{to{opacity:1;transform:none}}
.wm{transition:none}.wm.mv{animation:wmIn 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes wmIn{from{opacity:0;transform:translate(-44%,-56%)}to{opacity:1;transform:translate(-50%,-56%)}}
.sw button{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}}
.right{position:relative;z-index:2;justify-self:end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.plabel{font-size:10px;letter-spacing:.28em;opacity:.8;font-weight:600}
.price{font-family:Anton,sans-serif;font-size:clamp(40px,4.4vw,64px);line-height:1}
.price small{font-family:Inter;font-size:14px;font-weight:600;margin-left:4px;opacity:.85}
.pvc{font-size:14px;opacity:.9;margin-bottom:22px}
.pvc b{font-weight:700}
.sw{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;max-width:200px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:.2s;position:relative}
.sw button.on{transform:scale(1.22);border-color:var(--ink);box-shadow:0 0 0 2px rgba(0,0,0,.25),inset 0 0 0 2px rgba(0,0,0,.15)}
.cname{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:12px;font-weight:600}
.cref{font-size:11px;opacity:.75;margin-top:2px}
/* bottom */
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 34px 26px;z-index:4}
.pager{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.14em}
.pager .n{font-family:Anton;font-size:26px;letter-spacing:0}
.arw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;transition:.2s}
.arw:hover{background:var(--ink);color:var(--inv)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;border-radius:2px;background:var(--line);cursor:pointer;transition:.3s}
.dots i.on{width:38px;background:var(--ink)}
.mid{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;text-align:center;font-size:12px;letter-spacing:.06em;opacity:.9;line-height:1.5}
.mid b{display:block;font-size:13px;letter-spacing:.2em}
.next{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:0;padding:4px;transition:.25s;text-align:left}
.next:hover img{transform:scale(1.06)}.next img{transition:transform .3s}
.next .th{width:70px;height:62px;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.next img{max-width:62px;max-height:56px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.next small{display:block;font-size:10px;letter-spacing:.24em;opacity:.75}
.next span{font-family:Anton;font-size:18px;text-transform:uppercase}
/* detail */
.detail{position:fixed;inset:0;z-index:20;background:#f4f1ec;color:#141414;transform:translateY(100%);transition:transform .6s cubic-bezier(.7,0,.2,1);overflow:auto}
.detail.open{transform:none}
.dbg{position:absolute;inset:0;background:radial-gradient(circle at 70% 48%,var(--soft) 0,transparent 46%),radial-gradient(circle at 70% 48%,#fff 0,transparent 60%);pointer-events:none;transition:background .6s}
.dnav{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:22px 40px;z-index:3;background:linear-gradient(#f4f1ec,rgba(244,241,236,0))}
.back{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.16em}
.back i{width:38px;height:38px;border-radius:50%;border:1px solid #1414142e;display:grid;place-items:center;font-style:normal;transition:.2s}
.back:hover i{background:#141414;color:#fff}
.dbrand{font-size:12px;letter-spacing:.3em;font-weight:700}
.dgrid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(300px,.9fr) 1.6fr;gap:30px;padding:0 40px 40px;min-height:calc(100vh - 90px)}
.dl{padding-top:10px}
.dl h2{font-family:Anton;font-weight:400;font-size:clamp(52px,6.4vw,104px);line-height:.9;text-transform:uppercase}
.dl .dsub{font-size:14px;font-weight:600;margin:14px 0 10px}
.dl .ddesc{font-size:14px;line-height:1.65;color:#444;max-width:420px}
.dprice{display:flex;gap:30px;margin:26px 0 22px;align-items:flex-end}
.dprice div{display:flex;flex-direction:column;gap:4px}
.dprice small{font-size:10px;letter-spacing:.24em;font-weight:700;color:#777}
.dprice b{font-family:Anton;font-weight:400;font-size:44px;line-height:1}
.dprice b em{font-family:Inter;font-style:normal;font-size:13px;font-weight:600;color:#555;margin-left:3px}
.dprice .pv b{font-size:30px;color:#555}
.dsec{font-size:10px;letter-spacing:.24em;font-weight:700;color:#777;margin:20px 0 10px}
.dsw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dsw button{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px #0002 inset;transition:.2s}
.dsw button.on{box-shadow:0 0 0 2px #f4f1ec,0 0 0 4px #141414}
.dsw .lab{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;max-width:460px}
.sizes div{background:#fff;border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.6;color:#444;box-shadow:0 1px 0 #0000000d}
.sizes b{display:block;font-family:Anton;font-weight:400;font-size:22px;color:#141414}

.specs{max-width:560px;margin-top:18px;display:grid;gap:10px}
.specs .sb{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 0 #0000000d}
.specs h4{font-family:Anton;font-weight:400;font-size:15px;letter-spacing:.06em;margin:0 0 8px;color:#141414;text-transform:uppercase}
.specs dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;margin:0;font-size:12px;line-height:1.5}
.specs dt{color:#888;font-weight:600}.specs dd{margin:0;color:#333}
@media (max-width:760px){.specs dl{grid-template-columns:1fr;gap:1px}.specs dd{margin-bottom:6px}}
.meta{font-size:12px;color:#555;line-height:1.8;margin-top:16px}
.meta b{color:#141414}
.dr{position:relative;display:flex;flex-direction:column}
.bignum{position:absolute;right:10px;top:6px;font-family:Anton;font-size:120px;line-height:1;color:#14141414}
.vname{position:absolute;right:16px;top:132px;font-size:11px;letter-spacing:.26em;font-weight:700;color:#999}
.dmain{flex:1;display:flex;align-items:center;justify-content:center;min-height:420px;position:relative}
.dmain img.lr{max-height:min(40vh,400px)}
.dmain img{max-width:92%;max-height:62vh;object-fit:contain;filter:drop-shadow(0 30px 34px rgba(0,0,0,.22));transition:opacity .3s,transform .45s}
.dmain img.out{opacity:0;transform:scale(.97)}
.dmain img.turn-out{animation:turnOut .35s cubic-bezier(.55,0,.8,.4) forwards}
.dmain img.turn-in{animation:turnIn .6s cubic-bezier(.15,.75,.25,1) forwards}
.dmain{perspective:1400px;touch-action:pan-y;user-select:none}
.dmain.r360{cursor:grab}.dmain.r360.drag{cursor:grabbing}
.dmain img{-webkit-user-drag:none;pointer-events:none}
.v3d{position:absolute;inset:0;display:none;align-items:center;justify-content:center;perspective:2200px;cursor:grab;touch-action:pan-y;user-select:none}
.v3d.on{display:flex}.v3d.drag{cursor:grabbing}
.r3d{position:relative;transform-style:preserve-3d;will-change:transform}
.r3d .f{position:absolute;left:50%;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;-webkit-user-drag:none}
.r3d .hd{backface-visibility:visible}
.dmain .r3d img{max-width:none;max-height:none;filter:none;transition:none}
.r3d .tp{position:absolute;left:50%;border-radius:10px;backface-visibility:hidden}
.r3d .sh{position:absolute;left:50%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.28),transparent 70%);filter:blur(10px)}
.h3d{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;font-weight:700;color:#777;text-transform:uppercase}
.b360{position:absolute;left:60px;top:8px;display:none;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:8px 8px 8px 16px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#141414;box-shadow:0 6px 18px #0000001a;z-index:3}
.dmain.r360 .b360{display:flex}
.b360 .ic{font-size:14px;letter-spacing:0}
.b360 button{background:#141414;color:#fff;border-radius:20px;padding:7px 12px;font-size:10px;letter-spacing:.14em;font-weight:700}
.b360 .dots4{display:flex;gap:4px}.b360 .dots4 i{width:6px;height:6px;border-radius:50%;background:#14141426}.b360 .dots4 i.on{background:#141414}
.bignum .ch{animation-duration:.55s}
.dsw .dot{cursor:pointer;transition:transform .2s}.dsw .dot:hover{transform:scale(1.12)}
.dsw span.dot{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px #0002 inset;display:inline-block;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.dsw .dot{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px #0002 inset;display:inline-block}.dsw .dot.on{box-shadow:0 0 0 2px #f4f1ec,0 0 0 4px #141414}
.dsw span.dot.on{box-shadow:0 0 0 2px #f4f1ec,0 0 0 4px #141414}
.darr{position:absolute;top:50%;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 6px 18px #0000001a;display:grid;place-items:center;font-size:16px;transform:translateY(-50%)}
.darr.p{left:0}.darr.n{right:0}
.thumbs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding-top:10px}
.thumbs button{width:96px;height:96px;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;border:2px solid transparent;transition:.2s;box-shadow:0 2px 10px #0000000a}
.thumbs button img{max-width:100%;max-height:62px;object-fit:contain}
.thumbs button span{font-size:9px;letter-spacing:.16em;font-weight:700;color:#777;text-transform:uppercase}
.thumbs button.on{border-color:#141414}
.thumbs button:hover{transform:translateY(-3px)}
.note{font-size:11px;color:#888;text-align:center;margin-top:10px}
/* intro brand ribbon */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;background:#141414;color:#fff;padding:10px 18px;border-radius:30px;font-size:12px;z-index:40;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- tablette ---------- */
@media (max-width:1100px) and (min-width:761px){
 .hero{grid-template-columns:minmax(220px,1fr) minmax(300px,1.3fr) minmax(190px,.8fr);padding:110px 28px 100px}
 h1{font-size:clamp(40px,6vw,72px)}
 .brands{max-width:calc(100vw - 260px)}
 .navr{display:none}
 .dgrid{grid-template-columns:1fr 1.3fr;gap:20px;padding:0 24px 30px}
 .thumbs button{width:78px;height:80px}
 .mid{display:none}
}
/* ---------- mobile ---------- */
@media (max-width:760px){
 html,body{overflow:hidden}
 .nav{flex-direction:column;align-items:stretch;gap:10px;padding:14px 0 0}
 .logo{padding:0 16px;min-width:0;font-size:11px}
 .navr{display:none}
 .brands{max-width:none;width:auto;margin:0 12px;padding:4px;border-radius:30px}
 .brands button{padding:8px 12px;font-size:10.5px}
 .wm{font-size:38vw;top:34%}
 .hero{position:absolute;inset:104px 0 74px 0;display:flex;flex-direction:column;padding:0 18px;gap:0;overflow:hidden}
 .center{order:-1;flex:1 1 auto;min-height:0;height:auto;padding:4px 0 6px}
 .center img{max-height:min(36vh,330px)}
 .center img.lr{max-height:min(26vh,240px)}
 .left{display:contents}
 .kicker,h1,.sub{order:1;text-align:left;align-self:flex-start}
 .kicker{margin-bottom:6px;font-size:10px}
 h1{font-size:40px !important;line-height:.95}
 h1 br{display:none}
 .sub{margin:6px 0 4px;font-size:12px}
 .desc{display:none}
 .hero .cta{display:none}
 .cta2{display:inline-flex !important;margin:0;padding:10px 14px 10px 16px;font-size:12px}
 .right{order:2;width:100%;margin:12px 0 0;padding:0;justify-self:stretch;align-items:start;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"pl sw" "pr sw" "pv cn";column-gap:12px;row-gap:2px}
 .right>*{margin-left:0}
 .right .price,.right .pvc,.right>.plabel{justify-self:start;text-align:left}
 .right>.plabel{grid-area:pl}
 .right>.plabel~.plabel{display:none}
 .price{grid-area:pr;font-size:38px}
 .pvc{grid-area:pv;margin:0;font-size:12px}
 .sw{grid-area:sw;justify-content:flex-end;justify-self:end;align-self:center;max-width:none;gap:8px}
 .sw button{width:22px;height:22px}
 .cname{grid-area:cn;justify-self:end;text-align:right;margin:0;font-size:11px}
 .cref{display:none}
 .bottom{padding:0 18px 14px;align-items:center;justify-content:space-between}
 .pager{display:none !important}
 .pager{gap:8px}.pager .n{font-size:20px}.arw{width:34px;height:34px}
 .dots{display:none}
 .mid{display:none}
 .next{padding:0;gap:8px}.next .th{width:46px;height:42px}.next img{max-width:44px;max-height:40px}
 .next small{font-size:8px;letter-spacing:.16em}.next span{font-size:13px}
 /* détail */
 .dnav{padding:12px 16px;background:#f4f1ec;box-shadow:0 1px 0 #00000010}
 .dbrand{font-size:9px;letter-spacing:.2em;text-align:right;max-width:55%}
 .back{font-size:11px}.back i{width:34px;height:34px}
 .dgrid{display:flex;flex-direction:column;gap:12px;padding:0 16px 28px;min-height:0}
 .dr{order:-1}
 .dmain{min-height:0;height:46vh}
 .dmain img{max-height:42vh;max-width:86%}
 .darr{width:38px;height:38px}
 .bignum{font-size:56px;right:4px;top:0}.vname{top:58px;right:6px;font-size:9px}
 .thumbs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:8px;padding:6px 2px 4px;scrollbar-width:none}
 .thumbs::-webkit-scrollbar{display:none}
 .thumbs button{flex:0 0 auto;width:66px;height:72px;border-radius:14px}
 .thumbs button img{max-height:44px}
 .note{font-size:10px}
 .dl h2{font-size:52px !important}
 .dprice{margin:16px 0 12px;gap:22px}.dprice b{font-size:36px}.dprice .pv b{font-size:26px}
 .dsw{gap:8px}.dsw .dot{width:28px;height:28px}
 .sizes{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
 .sizes div{padding:10px 12px;font-size:11px}.sizes b{font-size:18px}
}
@media (max-width:760px) and (max-height:680px){
 .sub{display:none}
 .center img{max-height:30vh}
}

/* ---------- accueil marques ---------- */
#hub{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#111;transition:opacity .6s ease}
#hub.gone{opacity:0;pointer-events:none}
#hub .panels{flex:1;display:flex;min-height:0}
#hub .pn{position:relative;flex:1 1 0;min-width:0;overflow:hidden;cursor:pointer;transition:flex-grow .7s cubic-bezier(.7,0,.2,1),opacity .5s;color:#fff;background:var(--pc);display:flex;align-items:center;justify-content:center}
#hub .pn:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 48%,var(--pl) 0%,transparent 70%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.22))}
#hub .pn.lt{color:#141414}
#hub .pn.lt:before{background:radial-gradient(ellipse 80% 55% at 50% 48%,var(--pl) 0%,transparent 70%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.08))}
#hub .pn img{position:relative;max-width:78%;height:50vh;max-height:50vh;margin-top:9vh;object-fit:contain;filter:drop-shadow(0 26px 24px rgba(0,0,0,.35));transition:transform .7s cubic-bezier(.2,.8,.2,1)}

.lg{display:inline-block;height:calc(var(--lh,26px)*var(--k,1));width:auto;vertical-align:middle;overflow:hidden}
#LG .st0,#LG .st1{fill:currentColor}#LG .st2{fill:#df271d}#LG .st3{fill:#fff}#LG .st4{fill:#ffe400}#LG .keep.st0,#LG .keep.st1{fill:#1d1d1b}
.kicker .lg{--lh:24px}
.dbrand{display:flex;align-items:center;gap:12px}.dbrand .lg{--lh:20px}
#hub .pn .nm .lg{--lh:clamp(26px,2.6vw,44px);max-width:78%}

.navr{min-width:150px;display:flex;justify-content:flex-end;align-items:center}.navr .lg{--lh:30px}
.kicker .kt{display:inline}.kicker .lg{display:none}
#hub .pn .nm .lg{color:#fff;filter:drop-shadow(0 1px 10px rgba(0,0,0,.28))}
#hub .pn.lt .ct,#hub .pn.lt .ix{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3)}
@media (max-width:760px){.navr{display:none}.kicker .kt{display:none}.kicker .lg{display:inline-block}}
#hub .pn .nm{position:absolute;left:0;right:0;top:11vh;text-align:center;font-family:Anton,sans-serif;font-size:clamp(20px,2.1vw,36px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
#hub .pn .ct{position:absolute;left:0;right:0;bottom:7vh;text-align:center;font-size:10px;letter-spacing:.26em;font-weight:600;opacity:.75}
#hub .pn .ix{position:absolute;top:22px;left:18px;font-size:10px;letter-spacing:.2em;font-weight:700;opacity:.7}
#hub .panels:hover .pn{flex-grow:.85}
#hub .panels .pn:hover{flex-grow:1.9}
#hub .pn:hover img{transform:scale(1.08) translateY(-6px)}
#hub.open .pn{flex-grow:0.0001 !important;opacity:0}
#hub.open .pn.sel{flex-grow:1 !important;opacity:1}
#hub.open .pn.sel img{transform:scale(1.12)}
#hub .bar{height:64px;flex:0 0 64px;background:#fff;color:#141414;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-size:11px;letter-spacing:.22em;font-weight:700}
#hub .bar b{font-family:Anton,sans-serif;font-weight:400;font-size:22px;letter-spacing:.04em}
#hub .pn{animation:pnIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pnIn{from{transform:translateY(40px);opacity:0}}
.logo{cursor:pointer}
.cta2{display:none}
@media (max-width:760px){
 #hub .panels{flex-direction:column}
 #hub .pn{justify-content:flex-start;padding-left:18px}
 #hub .pn img{margin-top:0;height:86%;max-height:86%;max-width:38%;object-fit:contain}
 #hub .pn .nm .lg{--lh:26px}#hub .pn .nm{left:auto;right:20px;bottom:auto;top:50%;transform:translateY(-70%);text-align:right;font-size:26px}
 #hub .pn .ct{left:auto;right:20px;bottom:auto;top:50%;transform:translateY(130%);text-align:right}
 #hub .pn .ix{top:8px;left:auto;right:20px}
 #hub .panels:hover .pn,#hub .panels .pn:hover{flex-grow:1}
 #hub .bar{height:52px;flex-basis:52px;padding:0 16px;font-size:9px}
 #hub .bar b{font-size:18px}
 #hub .bar span:last-child{display:none}
}

}

function dViews(){const r=ranges()[I],v=dVar();return v&&v.views?v.views:r.views}
const BOX3D={};
function slides(){const v=dVar(),vw=dViews(),dup=vw.some(x=>x[1]===v.img);return [...(dup?[]:[["Lot",v.img]]),...vw]}
function openDetail(){V=0;renderDetail(true);$('detail').classList.add('open');$('detail').scrollTop=0}
function dColor(first){const r=ranges()[I],v=dVar();
 $('dsw').innerHTML=r.v.map((x,i)=>`<button class="dot${x===v?' on':''}" data-i="${i}" style="background:${x.hex};${first?`animation-delay:${750+i*70}ms`:'animation:none'}" title="${x.colorFr}"></button>`).join('')+`<span class="lab">${v.colorFr}</span>`;
 $('dsw').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=+b.dataset.i;if(n===C)return;C=n;const lab=slides()[V][0];dColor(false);
  const sl=slides();if(sl.length!==$('thumbs').children.length){$('thumbs').innerHTML=sl.map((s,i)=>`<button data-i="${i}"><img src="${s[1]}" alt=""><span>${s[0]}</span></button>`).join('');$('thumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>{V=+b.dataset.i;renderDetail()})}else $('thumbs').querySelectorAll('button').forEach((bt,i)=>{const im=bt.querySelector('img');if(sl[i])fadeImg(im,sl[i][1],150);bt.querySelector('span').textContent=sl[i][0]});
  const k=sl.findIndex(x=>x[0]===lab);V=k>=0?k:0;renderDetail()});
 const meta=`Réf. <b>${v.ref}</b><br>EAN lot <b>${v.ean}</b><br>Matière <b>${v.mat||'-'}</b> · Colisage <b>${v.pcb} pièce${v.pcb>1?'s':''}</b>`;
 if(first)fx($('meta'),meta,1200);else $('meta').innerHTML=meta;
 if(!first){$('dpt').innerHTML=eur(v.tarif)+'<em>HT</em>';$('dpv').innerHTML=eur(v.pvc)+'<em>TTC</em>'}
 setColors(v.hex);
}
function renderDetail(full){
 const r=ranges()[I],v=dVar(),v0=v||r.v[0],sl=slides();
 if(full){
  fx($('dbrand'),logo(r.brand)+'<span>COLLECTION 2027</span>',200);
  letters($('dtitle'),r.name,250,38);
  $('dtitle').style.fontSize=Math.max(...r.name.split(' ').map(w=>w.length))>8?'clamp(44px,4.8vw,78px)':'';
  fx($('dsub'),r.title.split('–')[1]?.trim()||r.kind,550);
  fx($('ddesc'),r.desc,650);
  setTimeout(()=>{countUp($('dpt'),v0.tarif,'<em>HT</em>',900);countUp($('dpv'),v0.pvc,'<em>TTC</em>',1100)},500);
  $('sizes').innerHTML=r.sizes.map((s,i)=>`<div class="fx" style="animation-delay:${900+i*110}ms"><b>${s[0]}</b>${s[1]}<br>${s[2]} cm`+(s[3]!=='-'?`<br>${s[3]} L · ${s[4]} kg`:'')+`</div>`).join('');
  $('specs').innerHTML=specsHTML(r);
  dColor(true);
  $('thumbs').innerHTML=sl.map((s,i)=>`<button class="fx" style="animation-delay:${500+i*80}ms" data-i="${i}"><img src="${s[1]==='#3d'?BOX3D[dVar().ref].dir+'S3D_front.webp':s[1]}" alt=""><span>${s[0]}</span></button>`).join('');
  $('thumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>{V=+b.dataset.i;renderDetail()});
  $('dimg').removeAttribute('src');
 }
 $('thumbs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===V));
 $('dimg').classList.toggle('lr',!!(v&&v.lowres&&sl[V][0]==='Lot'));
 if(sl[V][1]==='#3d'){$('dimg').style.opacity=0;show3d(dVar().ref)}else{$('v3d').classList.remove('on');$('dimg').style.display='';fadeImg($('dimg'),sl[V][1],FAST?90:230)}
 letters($('bignum'),String(V+1).padStart(2,'0'),full?300:0,60);
 fx($('vname'),sl[V][0]==='Lot'?'VUE D’ENSEMBLE':'VUE '+sl[V][0].toUpperCase(),full?400:80);
 $('note').textContent=dViews().length?(ranges()[I].views.length&&ranges()[I].pv!==C?'Vues détaillées : rendu du coloris généré à partir des vues produit.':''):'Vues détaillées à venir pour cette gamme.';
 $('dp').style.display=$('dn').style.display=sl.length>1?'':'none';
 $('thumbs').style.display=sl.length>1?'':'none';
}
$('cta').onclick=openDetail;$('cta2').onclick=openDetail;$('center').onclick=openDetail;
$('back').onclick=()=>{$('detail').classList.remove('open');lastRange=null;render()};
// --- rotation 360° sur 4 vues (face, côté 1, dos, côté 2)
let FAST=false;const RING=['Face','Côté 1','Dos','Côté 2'];
function ring(){return null}
function upd360(){const r=ring(),m=document.querySelector('.dmain');m.classList.toggle('r360',!!r);if(!r)return;const p=r.indexOf(V);$('dots4').innerHTML=RING.map((_,i)=>`<i class="${i===p?'on':''}"></i>`).join('')}
function turnTo(p){const r=ring();if(!r)return;p=((p%4)+4)%4;if(r[p]===V)return;V=r[p];FAST=true;renderDetail();FAST=false}
// --- pivot 3D sur l'axe vertical : 4 vues plaquées sur un volume (corps) + plan de poignée
let ang=-28,vel=0,auto=true,raf3=null,built=null;
function show3d(ref){const B=BOX3D[ref],box=$('r3d'),m=$('v3d');$('dimg').style.display='none';m.classList.add('on');
 const mh=document.querySelector('.dmain').getBoundingClientRect().height,H=Math.min(mh*.62,480),k=H/B.f[1];
 const W=B.f[0]*k,D=(B.r[0]+B.l[0])/2*k,hh=B.h[1]*k,ins=6*k; // léger retrait pour souder les arêtes
 if(built!==ref+H){built=ref+H;
  const p=B.dir+'S3D_';
  box.style.width='0px';box.style.height=(H+hh)+'px';
  box.innerHTML=`
   <div class="sh" style="width:${W*1.3}px;height:${D*.9}px;margin-left:${-W*.65}px;top:${hh+H-D*.45}px;transform:rotateX(90deg)"></div>
   <img class="f" src="${p}front.webp" style="width:${W}px;height:${H}px;margin-left:${-W/2}px;top:${hh}px;transform:translateZ(${D/2-ins}px)">
   <img class="f" src="${p}back.webp" style="width:${W}px;height:${H}px;margin-left:${-W/2}px;top:${hh}px;transform:rotateY(180deg) translateZ(${D/2-ins}px)">
   <img class="f" src="${p}right.webp" style="width:${D}px;height:${H}px;margin-left:${-D/2}px;top:${hh}px;transform:rotateY(90deg) translateZ(${W/2-ins}px)">
   <img class="f" src="${p}left.webp" style="width:${D}px;height:${H}px;margin-left:${-D/2}px;top:${hh}px;transform:rotateY(-90deg) translateZ(${W/2-ins}px)">
   <div class="tp" style="width:${W-2*ins}px;height:${D-2*ins}px;margin-left:${-(W-2*ins)/2}px;top:${hh+2*ins-(D-2*ins)/2}px;background:${B.top};transform:rotateX(90deg)"></div>
   <img class="f hd" src="${p}handle.webp" style="width:${W}px;height:${hh+2*ins}px;margin-left:${-W/2}px;top:0;transform:translateZ(${-D*.32}px)">`;
 }
 if(!raf3){const tick=()=>{if(auto)ang+=.25;else{ang+=vel;vel*=.94}box.style.transform=`rotateX(-6deg) rotateY(${ang}deg)`;raf3=requestAnimationFrame(tick)};raf3=requestAnimationFrame(tick)}
}
(function(){const m=$('v3d');let x0=null,a0=0,lx=0,lt=0;
 m.addEventListener('pointerdown',e=>{auto=false;x0=e.clientX;a0=ang;lx=e.clientX;lt=performance.now();vel=0;m.classList.add('drag');m.setPointerCapture(e.pointerId)});
 m.addEventListener('pointermove',e=>{if(x0===null)return;ang=a0+(e.clientX-x0)*.45;const t=performance.now();vel=(e.clientX-lx)*.45/Math.max(1,(t-lt)/16);lx=e.clientX;lt=t});
 const up=()=>{x0=null;m.classList.remove('drag')};m.addEventListener('pointerup',up);m.addEventListener('pointercancel',up);
})();
$('dp').onclick=()=>{const n=slides().length;V=(V-1+n)%n;renderDetail()};
$('dn').onclick=()=>{const n=slides().length;V=(V+1)%n;renderDetail()};
document.addEventListener('keydown',e=>{
 const d=$('detail').classList.contains('open');
 if(e.key==='Escape'&&d)$('back').click();
 if(e.key==='ArrowRight')d?$('dn').click():go(1);
 if(e.key==='ArrowLeft')d?$('dp').click():go(-1);
});
let wheelLock=0;
$('stage').addEventListener('wheel',e=>{if(innerWidth<900)return;const t=Date.now();if(t-wheelLock<900||Math.abs(e.deltaY)<25)return;wheelLock=t;go(e.deltaY>0?1:-1)},{passive:true});
let tx=null;$('center').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('center').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){go(dx<0?1:-1)}tx=null});
C=ranges()[0].def;render(true);
// --- accueil marques (panneaux verticaux) ---
function buildHub(){
 const P=$('panels');
 const PICK={'RAFALE':['Delta','Blue'],'TRAVEL WORLD':['Roots','Ivory'],'ITALERI':['Riviera','Terracota'],'MURANO':['Mezza','Dark yellow'],'PIERRE CARDIN':['Alpha','Sapin'],'NAF NAF':['Cendrillon','Pink'],'HELLO KITTY':['Deery',"Vert d'eau"],'GYL':['Intemporelle','Lil']};
 P.innerHTML=BRANDS.map((b,i)=>{const rs=DATA.filter(r=>r.brand===b),pk=PICK[b]||[],r=rs.find(x=>x.name===pk[0])||rs[0],v=r.v.find(x=>x.color===pk[1])||r.v[r.def],lt=lumOf(v.hex)>168;
  return `<div class="pn${lt?' lt':''}" data-b="${b}" data-i="${rs.indexOf(r)}" data-c="${r.v.indexOf(v)}" style="--pc:${lt?hexMix(v.hex,'#ffffff',.1):v.hex};--pl:${hexMix(v.hex,'#ffffff',lt?.7:.45)};animation-delay:${i*70}ms"><span class="ix">${String(i+1).padStart(2,'0')}</span><img src="${((v.views||r.views||[]).find(x=>x[0]==='Face')||[0,v.img])[1]}" alt=""><span class="nm">${logo(b)}</span><span class="ct">${rs.length} GAMMES</span></div>`}).join('');
 P.querySelectorAll('.pn').forEach(p=>p.onclick=()=>openBrand(p.dataset.b,p,+p.dataset.i,+p.dataset.c));
}
function openBrand(b,p,ii,cc){
 const hub=$('hub');hub.classList.add('open');p.classList.add('sel');
 B=b;I=ii||0;C=cc!=null?cc:ranges()[I].def;lastRange=null;if(wheelJob)wheelJob.finish();$('hero').removeAttribute('src');DIR=1;
 setTimeout(()=>{render(true);hub.classList.add('gone')},720);
 setTimeout(()=>{hub.style.display='none';hub.classList.remove('open');p.classList.remove('sel')},1350);
}
function showHub(){const hub=$('hub');hub.style.display='';$('detail').classList.remove('open');buildHub();void hub.offsetWidth;hub.classList.remove('gone')}
document.querySelector('.logo').onclick=showHub;
buildHub();

</script>
</body>
</html>
